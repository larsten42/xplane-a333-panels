<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>A330 Panels — X-Plane 12</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="stylesheet" href="./css/mcdu.css" />
  <!-- Defines <fcu-panel>, <efis-panel>, and their constituent custom
       elements — used by both panels below, so it's loaded once, here,
       rather than duplicated near each usage site. See vendor/README.md. -->
  <script src="./vendor/fcu-instruments.js"></script>
  <!-- Defines <radio-panel>, built from the primitives above — must load
       after fcu-instruments.js. See vendor/README.md. -->
  <script src="./vendor/radio.js"></script>
  <!-- Defines <rmp-panel>/<acp-panel>, also built from the primitives
       above — must load after fcu-instruments.js. See vendor/README.md. -->
  <script src="./vendor/rmp.js"></script>
</head>
<body>
  <header class="connection-bar">
    <label>Aircraft
      <select id="aircraft-select">
        <option value="a333">Airbus A330</option>
        <option value="toliss-airbus">ToLiss Airbus</option>
        <option value="b738">Boeing 737-800</option>
        <option value="generic">Generic</option>
      </select>
    </label>
    <label>Panel
      <select id="panel-select">
        <option value="mcdu">MCDU</option>
        <option value="efis">EFIS</option>
        <option value="fcu">FCU</option>
        <option value="radio">Radio</option>
        <option value="rmp">RMP+ACP</option>
      </select>
    </label>
    <label class="mcdu-only-control">CDU
      <select id="conn-cdu">
        <option value="1">1 · CAPT</option>
        <option value="2">2 · F/O</option>
        <option value="3">3 · OBS</option>
      </select>
    </label>
    <button id="conn-connect" type="button">Connect</button>
    <span id="conn-status" class="status status-closed">not connected</span>
    <label class="mcdu-only-control">Key style
      <select id="theme-select">
        <option value="flat">Flat</option>
        <option value="bevel">Bevel</option>
        <option value="deboss">Deboss</option>
      </select>
    </label>
  </header>
  <!-- Always visible, independent of .bar-hidden — #conn-status inside
       .connection-bar disappears along with the rest of the bar (e.g.
       flying full screen), leaving no way to notice a dropped connection
       without bringing the bar back up. Mirrors the same status classes
       app.js's setStatus() already sets on #conn-status. -->
  <span id="conn-led" class="conn-led status-closed" aria-hidden="true" title="Connection status"></span>
  <button id="bar-toggle" class="bar-toggle" type="button" aria-label="Hide top bar" title="Hide top bar">▲</button>
  <button id="fullscreen-toggle" class="bar-toggle fullscreen-toggle" type="button" aria-label="Enter full screen" title="Enter full screen">⛶</button>
  <!-- Only meaningful for FCU/EFIS (see body[data-panel] rule in
       mcdu.css) — MCDU has its own established sizing. One shared toggle
       and preference for both, since only one of the two is ever visible
       at a time. -->
  <button id="autoscale-toggle" class="bar-toggle autoscale-toggle" type="button" aria-label="Toggle auto-scale" title="Auto-scale: fit to window">FIT</button>

  <div id="panel-mcdu" class="panel-content">
    <main class="mcdu-unit">
      <div class="mcdu-lsk-column" id="mcdu-lsk-left"></div>
      <div class="mcdu-screen-frame">
        <div class="mcdu-screen" id="mcdu-screen"></div>
      </div>
      <div class="mcdu-lsk-column" id="mcdu-lsk-right"></div>
    </main>

    <div class="mcdu-keypad">
      <section class="mcdu-block mcdu-block-menu" id="mcdu-block-function"></section>
      <div class="mcdu-keypad-lower">
        <div class="mcdu-keypad-left-col">
          <section class="mcdu-block mcdu-block-menu" id="mcdu-block-utility"></section>
          <section class="mcdu-block mcdu-block-numeric" id="mcdu-block-numeric"></section>
        </div>
        <section class="mcdu-block mcdu-block-alpha" id="mcdu-block-alpha"></section>
      </div>
    </div>
  </div>

  <!-- <efis-panel>/<fcu-panel> are custom elements from the vendored
       component library (vendor/fcu-instruments.js, loaded in <head>) —
       they build their own DOM and style themselves entirely via inline
       styles, so there's no markup or CSS of ours to maintain here.
       src/efis-panel.js and src/fcu-panel.js wire the real X-Plane
       adapters to their window.efis/window.fcuPanel APIs once connected.
       See vendor/README.md for how to bring in an updated bundle. -->
  <div id="panel-efis" class="panel-content" hidden>
    <div class="scalable-panel">
      <efis-panel></efis-panel>
    </div>
  </div>

  <div id="panel-fcu" class="panel-content" hidden>
    <div class="scalable-panel">
      <fcu-panel></fcu-panel>
    </div>
  </div>

  <!-- Generic radio stack — unlike EFIS/FCU, this one has a profile for
       every aircraft (see AIRCRAFT_MCDU_PROFILES's neighboring comment in
       app.js), so it's never disabled in the panel selector. -->
  <div id="panel-radio" class="panel-content" hidden>
    <div class="scalable-panel">
      <radio-panel></radio-panel>
    </div>
  </div>

  <!-- Stock A330 RTP (radio management) + ACP (audio control), Captain's
       side only, VHF1/VHF2 for now — see src/rmp-panel.js and
       config/profiles/rmp-acp-a333.json. Two stacked scalable-panel
       wrappers rather than one shared one, since panel-autoscale.js scales
       one fixed-size vendored element per container. scalable-panel--stack
       (see css/mcdu.css) sizes each to its own scaled content instead of
       an equal fixed share, and lets #panel-rmp scroll if that's taller
       than the viewport — src/rmp-minimap.js is the floating control for
       that scrolling plus toggling either half's visibility, useful on a
       narrow/tall screen where both at once don't leave much room. -->
  <div id="panel-rmp" class="panel-content" hidden>
    <div class="scalable-panel scalable-panel--stack" data-rmp-wrapper="rmp">
      <rmp-panel></rmp-panel>
    </div>
    <div class="scalable-panel scalable-panel--stack" data-rmp-wrapper="acp">
      <acp-panel></acp-panel>
    </div>
  </div>

  <div id="rmp-minimap" class="rmp-minimap" hidden title="Show/hide RMP or ACP — drag to scroll">
    <div class="rmp-minimap-section" data-map-section="rmp">RMP</div>
    <div class="rmp-minimap-section" data-map-section="acp">ACP</div>
    <div class="rmp-minimap-viewport" data-map-viewport></div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
