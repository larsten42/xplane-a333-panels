<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>A330 Panels — X-Plane 12</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="stylesheet" href="./css/mcdu.css" />
  <!-- Defines <fcu-panel>, <efis-panel>, and their constituent custom
       elements — used by both panels below, so it's loaded once, here,
       rather than duplicated near each usage site. See vendor/README.md. -->
  <script src="./vendor/fcu-instruments.js"></script>
</head>
<body>
  <header class="connection-bar">
    <label>Panel
      <select id="panel-select">
        <option value="mcdu">MCDU</option>
        <option value="efis">EFIS</option>
        <option value="fcu">FCU</option>
      </select>
    </label>
    <label class="mcdu-only-control">CDU
      <select id="conn-cdu">
        <option value="1">1 · CAPT</option>
        <option value="2">2 · F/O</option>
        <option value="3">3 · OBS</option>
      </select>
    </label>
    <button id="conn-connect" type="button">Connect</button>
    <span id="conn-status" class="status status-closed">not connected</span>
    <label class="mcdu-only-control">Key style
      <select id="theme-select">
        <option value="flat">Flat</option>
        <option value="bevel">Bevel</option>
        <option value="deboss">Deboss</option>
      </select>
    </label>
  </header>
  <button id="bar-toggle" class="bar-toggle" type="button" aria-label="Hide top bar" title="Hide top bar">▲</button>
  <button id="fullscreen-toggle" class="bar-toggle fullscreen-toggle" type="button" aria-label="Enter full screen" title="Enter full screen">⛶</button>
  <!-- Only meaningful for FCU/EFIS (see body[data-panel] rule in
       mcdu.css) — MCDU has its own established sizing. One shared toggle
       and preference for both, since only one of the two is ever visible
       at a time. -->
  <button id="autoscale-toggle" class="bar-toggle autoscale-toggle" type="button" aria-label="Toggle auto-scale" title="Auto-scale: fit to window">FIT</button>

  <div id="panel-mcdu" class="panel-content">
    <main class="mcdu-unit">
      <div class="mcdu-lsk-column" id="mcdu-lsk-left"></div>
      <div class="mcdu-screen-frame">
        <div class="mcdu-screen" id="mcdu-screen"></div>
      </div>
      <div class="mcdu-lsk-column" id="mcdu-lsk-right"></div>
    </main>

    <div class="mcdu-keypad">
      <section class="mcdu-block mcdu-block-menu" id="mcdu-block-function"></section>
      <div class="mcdu-keypad-lower">
        <div class="mcdu-keypad-left-col">
          <section class="mcdu-block mcdu-block-menu" id="mcdu-block-utility"></section>
          <section class="mcdu-block mcdu-block-numeric" id="mcdu-block-numeric"></section>
        </div>
        <section class="mcdu-block mcdu-block-alpha" id="mcdu-block-alpha"></section>
      </div>
    </div>
  </div>

  <!-- <efis-panel>/<fcu-panel> are custom elements from the vendored
       component library (vendor/fcu-instruments.js, loaded in <head>) —
       they build their own DOM and style themselves entirely via inline
       styles, so there's no markup or CSS of ours to maintain here.
       src/efis-panel.js and src/fcu-panel.js wire the real X-Plane
       adapters to their window.efis/window.fcuPanel APIs once connected.
       See vendor/README.md for how to bring in an updated bundle. -->
  <div id="panel-efis" class="panel-content" hidden>
    <div class="scalable-panel">
      <efis-panel></efis-panel>
    </div>
  </div>

  <div id="panel-fcu" class="panel-content" hidden>
    <div class="scalable-panel">
      <fcu-panel></fcu-panel>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
